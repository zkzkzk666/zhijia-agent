<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智驾辅助 Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-logo">🧭</div>
        <div class="brand-text">
          <h1>智驾辅助 Agent</h1>
          <p>智能驾驶领域专家助理</p>
        </div>
      </div>

      <button id="newChatBtn" class="btn primary full">＋ 新建会话</button>

      <div class="search-wrap">
        <input type="text" id="sessionSearch" placeholder="🔍 搜索会话…" />
      </div>

      <div class="sidebar-section">
        <h2 class="section-title">📚 知识库 <span class="kb-count" id="kbCount"></span></h2>
        <div id="kbList" class="kb-list"></div>
        <label class="upload-btn btn ghost full">
          ＋ 上传文件（.txt / .md）
          <input type="file" id="kbFileInput" accept=".txt,.md,.markdown,text/plain,text/markdown" multiple hidden />
        </label>
        <button id="importKbBtn" class="btn ghost full" title="导入项目自带的智驾领域参考文档">📚 导入内置知识库</button>
        <p class="hint kb-hint">提问时自动检索相关片段并注入上下文</p>
      </div>

      <div class="sidebar-section">
        <h2 class="section-title">🛠️ 提示词模板</h2>
        <div class="template-bar">
          <select id="templateSelect" class="template-select"></select>
          <button type="button" id="customTemplateBtn" class="icon-btn" title="自定义提示词库">✎</button>
        </div>
      </div>

      <div class="sidebar-section">
        <h2 class="section-title">角色模式</h2>
        <div id="roleList" class="role-list"></div>
      </div>

      <div class="sidebar-section">
        <h2 class="section-title">常用话题</h2>
        <div id="presetTopics" class="topics"></div>
      </div>

      <div class="sidebar-footer">
        <div class="footer-stats" id="statsLine"></div>
        <div class="footer-btns">
          <button id="backupBtn" class="btn ghost half">💾 备份</button>
          <button id="restoreBtn" class="btn ghost half">📂 恢复</button>
        </div>
        <button id="settingsBtn" class="btn ghost full">⚙️ 接口与参数设置</button>
      </div>
    </aside>

    <main id="main">
      <header id="chatHeader">
        <div class="header-left">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">未连接</span>
        </div>
        <div class="header-right">
          <select id="modelSelect" title="当前模型"></select>
          <button id="searchToggle" class="icon-btn" title="联网搜索">🌐</button>
          <button id="themeToggle" class="icon-btn" title="切换主题">🌙</button>
          <button id="clearSessionBtn" class="icon-btn" title="清空当前会话">🗑️</button>
          <button id="exportBtn" class="icon-btn" title="导出对话为 Markdown">📄</button>
        </div>
      </header>

      <div id="sessionTitle" class="session-title"></div>
      <div class="msg-search-bar hidden" id="msgSearchBar">
        <input type="text" id="msgSearchInput" placeholder="🔍 搜索本会话消息…" />
        <button class="mini" id="msgSearchClose">✕</button>
        <span class="msg-search-count" id="msgSearchCount"></span>
      </div>

      <div id="messages"></div>

      <div id="welcome">
        <div class="welcome-hero">
          <div class="welcome-icon">🧭</div>
          <h2>你好，我是智驾辅助 Agent</h2>
          <p>选择角色模式、加载知识库，或直接输入问题。输入 <code>/help</code> 查看斜杠命令。</p>
        </div>
        <div id="welcomeTopics" class="topics"></div>
      </div>

      <form id="chatForm">
        <div class="attach-chip hidden" id="attachChip"></div>
        <div class="input-wrap">
          <button type="button" id="attachBtn" class="icon-btn" title="上传文件/图片到对话">📎</button>
          <input type="file" id="attachInput" multiple hidden accept="*" />
          <textarea id="input" placeholder="输入问题，或输入 / 查看命令。Enter 发送，Shift+Enter 换行…" rows="1"></textarea>
          <button type="button" id="voiceBtn" class="icon-btn" title="语音输入">🎤</button>
          <button type="submit" id="sendBtn" class="btn primary round">发送</button>
          <button type="button" id="stopBtn" class="btn danger round hidden">停止</button>
        </div>
        <div class="form-footer">
          <span class="hint" id="formHint">Enter 发送 · Shift+Enter 换行 · 支持 Markdown / 文件 / 知识库</span>
        </div>
      </form>
    </main>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>接口与参数设置</h2>
        <button class="icon-btn" id="modalClose">✕</button>
      </div>

      <label>已保存接口配置</label>
      <div class="provider-bar">
        <select id="providerSelect" class="template-select"></select>
        <button type="button" id="saveProviderBtn" class="btn ghost small" title="保存当前配置">＋</button>
        <button type="button" id="delProviderBtn" class="btn ghost small" title="删除选中配置">🗑</button>
      </div>

      <label>Base URL</label>
      <input type="text" id="setBaseUrl" placeholder="https://api.openai.com/v1" />
      <label>API Key</label>
      <input type="password" id="setApiKey" placeholder="sk-..." />
      <label>模型</label>
      <input type="text" id="setModel" placeholder="gpt-4o-mini" />
      <label>温度（0~2，越高越发散）</label>
      <input type="number" id="setTemperature" min="0" max="2" step="0.1" value="0.7" />
      <div class="param-row">
        <div>
          <label>Top-P（0~1）</label>
          <input type="number" id="setTopP" min="0" max="1" step="0.05" value="1" />
        </div>
        <div>
          <label>最大输出 Tokens</label>
          <input type="number" id="setMaxTokens" min="1" placeholder="留空不限" />
        </div>
      </div>
      <div class="param-row">
        <div>
          <label>频率惩罚（-2~2）</label>
          <input type="number" id="setFreqPenalty" min="-2" max="2" step="0.1" value="0" />
        </div>
        <div>
          <label>存在惩罚（-2~2）</label>
          <input type="number" id="setPresencePenalty" min="-2" max="2" step="0.1" value="0" />
        </div>
      </div>
      <label>知识库注入片段数（每次提问最多注入几段）</label>
      <input type="number" id="setKbTopK" min="1" max="10" value="3" />
      <label class="check-row">
        <input type="checkbox" id="setStreamReasoning" /> 显示思维链（推理过程，DeepSeek-R1 等模型支持）
      </label>
      <label>回复偏好（语气 / 长度）</label>
      <select id="setStyle" class="template-select">
        <option value="">默认</option>
        <option value="brief">简洁版 - 回答精炼，要点优先，减少客套</option>
        <option value="detail">详细版 - 深入全面，给出背景与细节</option>
        <option value="formal">严谨版 - 用正式专业语言，谨慎给出结论</option>
        <option value="friendly">友好版 - 语气亲切，通俗易懂</option>
        <option value="table">结构化 - 尽量用表格/列表组织答案</option>
      </select>
      <label>自定义系统提示词（覆盖角色模式）</label>
      <textarea id="setSystemPrompt" rows="4" placeholder="可粘贴你的专属 prompt…"></textarea>
      <p class="hint">API Key 仅保存在浏览器本地，留空则使用服务端 .env 配置。</p>
      <div class="modal-actions">
        <button id="modalCancel" class="btn ghost">取消</button>
        <button id="modalSave" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="templateModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>自定义提示词库</h2>
        <button class="icon-btn" id="templateModalClose">✕</button>
      </div>
      <label>模板名称</label>
      <input type="text" id="customTmplName" placeholder="例如：MIL 评审 / 接管分析" />
      <label>模板内容（提示词）</label>
      <textarea id="customTmplPrompt" rows="6" placeholder="粘贴你的自定义 prompt…"></textarea>
      <div class="modal-actions">
        <button id="addCustomTmplBtn" class="btn primary">保存为新模板</button>
      </div>
      <label>已保存的模板</label>
      <div id="customTmplList" class="tmpl-list"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
